---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: backupstores.heirloom.io
spec:
  group: heirloom.io
  names:
    kind: BackupStore
    listKind: BackupStoreList
    plural: backupstores
    singular: backupstore
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.nfs.server
      name: Server
      type: string
    - jsonPath: .spec.nfs.path
      name: Path
      type: string
    - jsonPath: .spec.smb.server
      name: SMB Server
      priority: 1
      type: string
    - jsonPath: .spec.smb.share
      name: SMB Share
      priority: 1
      type: string
    name: v1
    schema:
      openAPIV3Schema:
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: BackupStoreSpec describes where backups live. Set exactly
              one of nfs or smb.
            properties:
              encryption:
                description: |-
                  Encryption encrypts the restic repositories. Without it they are passwordless (restic
                  --insecure-no-password) and the storage's access control is the only protection.
                  Existing passwordless repositories cannot be opened by an encrypted store (and vice versa): start from
                  empty policy folders, or migrate with `restic copy`.
                properties:
                  passwordSecretRef:
                    description: |-
                      PasswordSecretRef names the Secret holding the store's master password. The operator reads it (so it must
                      live in the operator's namespace) and never hands it to a mover: each policy's repository gets its own
                      password, HMAC-SHA256(master, "heirloom/v1/<namespace>/<policy>") in hex, copied into a Secret in the
                      policy's namespace. A tenant therefore only ever holds the key to its own repository.
                      Changing the master later makes every existing repository unreadable: restic cannot rekey from here.
                    properties:
                      key:
                        default: password
                        type: string
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                required:
                - passwordSecretRef
                type: object
              nfs:
                description: NFSSpec points at an NFS export that receives the restic
                  repositories.
                properties:
                  mountOptions:
                    description: |-
                      MountOptions are passed verbatim to the NFS mount on mover pods, e.g. ["nfsvers=4.1", "hard",
                      "timeo=50"]. Without them the kubelet negotiates defaults; pin nfsvers when the export needs it.
                    items:
                      pattern: ^[A-Za-z0-9,.:=/_-]+$
                      type: string
                    maxItems: 10
                    type: array
                  path:
                    description: Path of the export, e.g. /volume1/k8s-backup.
                    pattern: ^/.*
                    type: string
                  server:
                    minLength: 1
                    type: string
                required:
                - path
                - server
                type: object
              retention:
                description: |-
                  Retention applied to policies that do not set their own.
                  Defaults to hourly=24 daily=30 weekly=12 monthly=24.
                properties:
                  daily:
                    format: int32
                    minimum: 0
                    type: integer
                  hourly:
                    format: int32
                    minimum: 0
                    type: integer
                  monthly:
                    format: int32
                    minimum: 0
                    type: integer
                  weekly:
                    format: int32
                    minimum: 0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: 'set at least one of hourly, daily, weekly, monthly (hourly:
                    1 keeps only the newest snapshot)'
                  rule: '(has(self.hourly) ? self.hourly : 0) + (has(self.daily) ?
                    self.daily : 0) + (has(self.weekly) ? self.weekly : 0) + (has(self.monthly)
                    ? self.monthly : 0) > 0'
              smb:
                description: |-
                  SMBSpec points at an SMB/CIFS share that receives the restic repositories. The share is mounted by the
                  csi-driver-smb CSI driver (smb.csi.k8s.io), which must be installed in the cluster.
                properties:
                  credentialsSecretRef:
                    description: |-
                      CredentialsSecretRef names a Secret holding the keys username and password (and optionally domain), as
                      csi-driver-smb expects. The kubelet and the CSI driver read it, not the operator.
                    properties:
                      name:
                        minLength: 1
                        type: string
                      namespace:
                        minLength: 1
                        type: string
                    required:
                    - name
                    - namespace
                    type: object
                  mountOptions:
                    description: |-
                      MountOptions are passed verbatim to the CIFS mount on mover pods, e.g. ["vers=3.0", "uid=0", "gid=0",
                      "dir_mode=0700", "file_mode=0600"]. Without them the driver's defaults apply.
                    items:
                      pattern: ^[A-Za-z0-9,.:=/_-]+$
                      type: string
                    maxItems: 20
                    type: array
                  server:
                    description: Server is the host name or address of the SMB server.
                    minLength: 1
                    type: string
                  share:
                    description: Share is the name of the share on the server, without
                      slashes, e.g. k8s-backup.
                    pattern: ^[^/\\]+$
                    type: string
                required:
                - credentialsSecretRef
                - server
                - share
                type: object
            type: object
            x-kubernetes-validations:
            - message: set exactly one of nfs or smb
              rule: has(self.nfs) != has(self.smb)
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources: {}
