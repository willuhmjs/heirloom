{{- if .Values.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "backshots.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backshots.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "backshots.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8443
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "backshots.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "backshots.labels" . | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "backshots.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.metrics.secure }}
      scheme: https
      # The caller authenticates with its ServiceAccount token. The server certificate is self-signed.
      bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
{{- end }}
