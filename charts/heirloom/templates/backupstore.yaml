{{- if .Values.store.create }}

apiVersion: heirloom.io/v1
kind: BackupStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
spec:
  nfs:
    server: {{ required "store.nfs.server is required when store.create=true" .Values.store.nfs.server | quote }}
    path: {{ required "store.nfs.path is required when store.create=true" .Values.store.nfs.path | quote }}
    {{- with .Values.store.nfs.mountOptions }}
    mountOptions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- with .Values.store.retention }}
  retention:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
