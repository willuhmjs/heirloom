{{- if .Values.store.create }}

apiVersion: heirloom.io/v1
kind: BackupStore
metadata:
  name: {{ .Values.store.name }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
spec:
  {{- if .Values.store.smb.server }}
  {{- if .Values.store.nfs.server }}
  {{- fail "set either store.nfs or store.smb, not both" }}
  {{- end }}
  smb:
    server: {{ .Values.store.smb.server | quote }}
    share: {{ required "store.smb.share is required with store.smb.server" .Values.store.smb.share | quote }}
    credentialsSecretRef:
      name: {{ required "store.smb.credentialsSecret is required with store.smb.server" .Values.store.smb.credentialsSecret | quote }}
      namespace: {{ .Values.store.smb.credentialsSecretNamespace | default .Release.Namespace | quote }}
    {{- with .Values.store.smb.mountOptions }}
    mountOptions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- else }}
  nfs:
    server: {{ required "store.nfs.server (or store.smb.server) is required when store.create=true" .Values.store.nfs.server | quote }}
    path: {{ required "store.nfs.path is required when store.create=true" .Values.store.nfs.path | quote }}
    {{- with .Values.store.nfs.mountOptions }}
    mountOptions:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- with .Values.store.retention }}
  retention:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
