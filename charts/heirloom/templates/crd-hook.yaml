{{- if .Values.crdHooks.enabled }}
{{- /*
Helm installs crds/ on first install and never upgrades them. These hooks close that gap: before
every install or upgrade, a Job running the operator's own image applies the CRD manifests embedded
in it (heirloom install-crds). A failed hook fails the release, so schema drift cannot slip past.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "heirloom.fullname" . }}-crd-hook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "heirloom.fullname" . }}-crd-hook
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "heirloom.fullname" . }}-crd-hook
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "heirloom.fullname" . }}-crd-hook
subjects:
  - kind: ServiceAccount
    name: {{ include "heirloom.fullname" . }}-crd-hook
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "heirloom.fullname" . }}-crd-hook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "heirloom.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "heirloom.fullname" . }}-crd-hook
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: crd-hook
          image: {{ include "heirloom.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [install-crds]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
{{- end }}
