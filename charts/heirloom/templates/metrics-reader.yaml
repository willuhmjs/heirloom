{{- if .Values.metrics.secure }}
# Grants read access to /metrics. Bind it to the ServiceAccount of whatever scrapes the manager, for example:
#   kubectl create clusterrolebinding prom-heirloom --clusterrole={{ include "heirloom.fullname" . }}-metrics-reader --serviceaccount=monitoring:prometheus-k8s
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "heirloom.fullname" . }}-metrics-reader
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- end }}
