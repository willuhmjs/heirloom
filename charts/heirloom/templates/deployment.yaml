apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "heirloom.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    # Recreate while a single replica; with more, leader election makes a rolling update safe.
    type: {{ if gt (int .Values.replicas) 1 }}RollingUpdate{{ else }}Recreate{{ end }}
  selector:
    matchLabels:
      {{- include "heirloom.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "heirloom.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "heirloom.fullname" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "heirloom.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - manager
            - --metrics-bind-address=:8443
            - --metrics-secure={{ .Values.metrics.secure }}
            - --health-probe-bind-address=:8081
            {{- if .Values.leaderElection }}
            - --leader-elect
            {{- end }}
          env:
            - name: HEIRLOOM_IMAGE
              value: {{ include "heirloom.image" . | quote }}
          ports:
            - name: metrics
              containerPort: 8443
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
