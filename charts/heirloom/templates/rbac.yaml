apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "heirloom.fullname" . }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
rules:
  - apiGroups: [heirloom.io]
    resources: [backupstores, backuppolicies, restores]
    verbs: [get, list, watch]
  - apiGroups: [heirloom.io]
    resources: [backuppolicies/status, restores/status]
    verbs: [get, update]
  # A Restore carries a finalizer so that deleting it mid-flight puts scaled-down workloads back (metadata update).
  - apiGroups: [heirloom.io]
    resources: [restores]
    verbs: [update]
  # Jobs are owned by their policy or restore with blockOwnerDeletion, which needs this where the
  # OwnerReferencesPermissionEnforcement admission plugin is on.
  - apiGroups: [heirloom.io]
    resources: [backuppolicies/finalizers, restores/finalizers]
    verbs: [update]
  # A restore checks that the claim it writes to exists before it stops any workload (uncached get only).
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, create, patch]
  # A store with mountOptions, or an SMB share, is mounted through a provisioned static PV/PVC (inline NFS
  # volumes cannot carry mount options); the PV is only a pointer at the export, never a data deleter.
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, create, delete]
  # The command source maintains a namespace-local executor identity (SA + Role + RoleBinding) whose
  # only power is reading pods and creating pods/exec for the policy's mover pods.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, patch]
  # A Restore pauses autoscalers targeting the workloads it stops, then puts their bounds back.
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, update, patch]
  # Secure metrics: authenticate the caller's token and authorize it for /metrics.
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
  # Events on health changes and restore progress, visible in kubectl describe. The manager's
  # recorder writes the events.k8s.io form; the core group stays for the legacy projection.
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # The controller schedules runs itself: it creates one Job per due run and prunes old finished Jobs.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  # Restore scales workloads down and up; read uncached with get, changed with a merge patch of replicas and annotations.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "heirloom.fullname" . }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "heirloom.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "heirloom.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "heirloom.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "heirloom.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "heirloom.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "heirloom.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "heirloom.fullname" . }}
    namespace: {{ .Release.Namespace }}
