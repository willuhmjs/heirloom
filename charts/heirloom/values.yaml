image:
  repository: ghcr.io/willuhmjs/heirloom
  # Defaults to the chart appVersion. Also used as the mover (runner) image via HEIRLOOM_IMAGE.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
podAnnotations: {}

leaderElection: true

# Replicas of the manager. More than one needs leaderElection (the default) and becomes a rolling
# update; the PDB keeps a voluntary eviction from taking the last replica down with it.
replicas: 1

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: 1

# Apply the CRDs embedded in the image on every install and upgrade (Helm would only ever install
# crds/ once). Disable only if you manage CRDs yourself.
crdHooks:
  enabled: true

# Metrics are served over TLS and require an authenticated, authorized caller. Bind the ClusterRole
# <release>-metrics-reader to whatever scrapes them (the ServiceMonitor below uses Prometheus's token).
metrics:
  secure: true

serviceMonitor:
  enabled: false
  interval: 60s
  labels: {}

# Optionally render a default cluster-scoped BackupStore.
store:
  create: false
  name: default
  nfs:
    server: ""
    path: ""
    # Passed verbatim to the store mount, e.g. ["nfsvers=4.1", "hard"]. Sets the operator
    # provisioning a static PV/PVC per namespace (inline NFS volumes cannot carry options).
    mountOptions: []
  # Defaults when omitted: hourly=24 daily=30 weekly=12 monthly=24
  retention: {}
