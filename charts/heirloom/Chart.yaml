apiVersion: v2
name: heirloom
description: Kubernetes-native backups that land as deduplicated restic repositories on your NAS. App-consistent Postgres and SQLite dumps, GFS retention with prune, restores that are tested.
type: application
version: 1.2.0
appVersion: 1.2.0
kubeVersion: ">=1.29.0-0"
home: https://willuhmjs.github.io/heirloom/
icon: https://raw.githubusercontent.com/willuhmjs/heirloom/main/docs/assets/logo.svg
sources:
  - https://github.com/willuhmjs/heirloom
keywords:
  - backup
  - restore
  - nfs
  - smb
  - postgres
  - sqlite
  - snapshots
  - operator
  - gitops
maintainers:
  - name: William Faircloth
    url: https://github.com/willuhmjs
annotations:
  artifacthub.io/license: Apache-2.0
  artifacthub.io/category: storage
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/crds: |
    - kind: BackupStore
      version: v1
      name: backupstores.heirloom.io
      displayName: Backup store
      description: The NFS export or SMB share that receives the backups.
    - kind: BackupPolicy
      version: v1
      name: backuppolicies.heirloom.io
      displayName: Backup policy
      description: What to back up (files, SQLite, Postgres), when, and how long to keep it.
    - kind: Restore
      version: v1
      name: restores.heirloom.io
      displayName: Restore
      description: Restore a policy's data from a snapshot.
  artifacthub.io/crdsExamples: |
    - apiVersion: heirloom.io/v1
      kind: BackupPolicy
      metadata:
        name: gitea-db
        namespace: gitea
      spec:
        storeRef: nas
        schedule: "0 * * * *"
        source:
          type: postgres
          postgres:
            image: postgres:16
            host: postgres.gitea.svc
            passwordSecretRef: {name: postgres, key: password}
  artifacthub.io/images: |
    - name: heirloom
      image: ghcr.io/willuhmjs/heirloom:0.1.0
  artifacthub.io/links: |
    - name: Documentation
      url: https://github.com/willuhmjs/heirloom/blob/main/docs/REFERENCE.md
    - name: Restore runbooks
      url: https://github.com/willuhmjs/heirloom/blob/main/docs/RESTORE-RUNBOOKS.md
