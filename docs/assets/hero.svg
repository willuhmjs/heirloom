      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14233f"/>
    </linearGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <g transform="translate(96 96) scale(0.88)">
    <rect width="256" height="256" rx="56" fill="#0f172a" stroke="#1e3357" stroke-width="3"/>
    <rect x="70" y="58" width="128" height="104" rx="18" fill="none" stroke="url(#g)" stroke-width="8" opacity=".35"/>
    <rect x="58" y="76" width="128" height="104" rx="18" fill="none" stroke="url(#g)" stroke-width="8" opacity=".6"/>
    <rect x="46" y="94" width="128" height="104" rx="18" fill="#0f172a" stroke="url(#g)" stroke-width="8"/>
    <path d="M82 148 l22 22 l44 -46" fill="none" stroke="url(#g)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="372" y="168" font-size="88" font-weight="800" fill="#f8fafc" letter-spacing="-2">heirloom</text>
    <text x="374" y="222" font-size="30" fill="#cbd5e1">Kubernetes-native backups that land as</text>
    <text x="374" y="262" font-size="30" fill="#cbd5e1">dedup repos on your NAS.</text>
