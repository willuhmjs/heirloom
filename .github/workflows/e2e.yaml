name: e2e
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
    # Only what the end-to-end run actually exercises; docs and the site stay quiet.
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "config/crd/**"
      - "charts/heirloom/**"
      - "scripts/e2e.sh"
      - "scripts/e2e/**"
      - ".github/workflows/e2e.yaml"
# A kind cluster from an older push tells nothing about the new one; kill it instead of waiting.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  e2e:
    name: kind + NFS + chart
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The script needs docker (already on the runner image) plus kind, kubectl and helm. These are
      # pinned by version and checksum instead of using the runner's preinstalled copies: those shift
      # with every runner image update, and kind's default node image is derived from the kind
      # version, so an unpinned kind quietly changes the Kubernetes the chart is tested against.
      # restic and sqlite3 are deliberately not installed on the host: both live inside the operator
      # image (see Dockerfile), which is what the movers and the web workload actually run.
      - name: Install pinned kubectl, kind and helm
        run: |
          set -euo pipefail
          curl -fsSLo kubectl --retry 3 https://dl.k8s.io/release/v1.37.2/bin/linux/amd64/kubectl
          echo 'c04487523e7aa7d1493f7808174c899db93d7a9cf57531420cd76b9bd415f8f4  kubectl' | sha256sum -c -
          curl -fsSLo kind --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo 'aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind' | sha256sum -c -
          curl -fsSLo helm.tgz --retry 3 https://get.helm.sh/helm-v3.22.1-linux-amd64.tar.gz
          echo '896cf63684a42a723d61c980369d6e588330927deb13676ca0d85006dd6da0ea  helm.tgz' | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install -m 0755 kubectl kind /usr/local/bin/
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
          kubectl config view >/dev/null
          kind version
          helm version --short
      # The NFS server of scripts/e2e/nfs is a privileged container, but privileged or not it has no
      # kernel of its own: the nfsd module must be loaded on the runner host first, or rpc.nfsd in
      # that container dies and every NFS assertion fails much later. Fail loudly here instead.
      - name: NFS kernel server support
        run: |
          # TEMP diagnostics: run the setup, then surface its trace as a public annotation if it fails.
          cat > /tmp/nfs.sh <<'SCRIPT'
          set -euxo pipefail
          uname -r
          sudo apt-get update
          sudo systemctl mask nfs-server.service nfs-mountd.service rpc-statd.service || true
          sudo apt-get install -y nfs-kernel-server || true
          if ! sudo modprobe nfsd; then
            sudo apt-get install -y "linux-modules-extra-$(uname -r)" || sudo apt-get install -y linux-modules-extra-azure
            sudo modprobe nfsd
          fi
          mountpoint -q /proc/fs/nfsd || sudo mount -t nfsd nfsd /proc/fs/nfsd
          cat /proc/fs/nfsd/versions
          SCRIPT
          if ! bash /tmp/nfs.sh > /tmp/nfs.log 2>&1; then
            body=$(tail -n 40 /tmp/nfs.log | tr -d '%' | tr -s '[:space:]' ' ' | cut -c1-3500)
            echo "::error title=nfs-step::${body}"
            exit 1
          fi
      # All of this lands on one runner: kind node image (~1 GiB), postgres, the operator, mover
      # pods and two ~10-minute image builds. 30 minutes is roomy for the script's own ~5 minutes.
      - name: End-to-end run
        run: scripts/e2e.sh
      # The script's EXIT trap removes the cluster and the NFS container even on failure, so there
      # is no kind cluster left to describe at this point; keep what explains a dead run instead.
      - name: Host diagnostics
        if: failure()
        run: |
          docker ps -a || true
          free -m || true
          sudo dmesg -T | tail -n 100 || true
