name: publish-dev
on:
  workflow_dispatch: {}
# No permissions by default; each job asks for exactly what it needs.
permissions: {}
jobs:
  image:
    # A manually published build for testing on real clusters before a release: the same
    # verification the release runs, then an amd64 image pushed as dev-<sha>. Nothing here
    # signs, packages the chart, or touches the helm repository; a v* tag still owns releases.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The mover runs are all restic now; without the binary the runner tests skip silently.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq restic
      - run: go vet ./...
      - run: go test ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # amd64 only, deliberately: this image exists to test on amd64 clusters, and building arm64
          # here means running the Go compiler under QEMU for fifteen minutes of wall clock for nobody.
          # Releases stay multi-arch; that is what the v* tag pipeline with real arm hardware is for.
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}:dev-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Image reference
        run: echo "deploy with ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
