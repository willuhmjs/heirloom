name: publish-dev
on:
  workflow_dispatch: {}
# No permissions by default; each job asks for exactly what it needs.
permissions: {}
jobs:
  image:
    # A manually published build for testing on real clusters before a release: the same
    # verification the release runs, then a multi-arch image pushed as dev-<sha>. Nothing here
    # signs, packages the chart, or touches the helm repository; a v* tag still owns releases.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # The mover runs are all restic now; without the binary the runner tests skip silently.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq restic
      - run: go vet ./...
      - run: go test ./...
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/${{ github.repository }}:dev-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Image reference
        run: echo "deploy with ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
