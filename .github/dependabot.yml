version: 2
updates:
  # Keeps the pinned action SHAs and image digests current, one reviewable PR at a time.
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: gomod
    directory: /
    schedule: {interval: weekly}
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
